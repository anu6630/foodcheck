name: iosApp
options:
  bundleIdPrefix: biz.lifex
  deploymentTarget:
    iOS: "16.0"
targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: biz.lifex.foodcheck
        DEVELOPMENT_TEAM: KRQW92M2Q4
        INFOPLIST_FILE: iosApp/Info.plist
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_BITCODE: NO
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/../composeApp/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-framework"
          - "composeApp"
    preBuildScripts:
      - name: "Compile Kotlin Framework"
        script: |
          if [ -d "$HOME/.sdkman/candidates/java/current" ]; then
              export JAVA_HOME="$HOME/.sdkman/candidates/java/current"
              export PATH="$JAVA_HOME/bin:$PATH"
          elif [ -z "$JAVA_HOME" ]; then
              export JAVA_HOME=$(/usr/libexec/java_home -v 21 2>/dev/null || /usr/libexec/java_home 2>/dev/null)
              export PATH="$JAVA_HOME/bin:$PATH"
          fi
          cd "$SRCROOT/.."
          ./gradlew :composeApp:embedAndSignAppleFrameworkForXcode
        basedOnDependencyAnalysis: false
        outputFiles:
          - "$(SRCROOT)/../composeApp/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)/composeApp.framework"
